[package]
name = "jcc"
version = "0.1.0"
description = "Java Control Centre desktop backend"
authors = ["Java Control Centre contributors"]
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/java-control-centre/java-control-centre"

[lib]
name = "jcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
rusqlite = { version = "0.43", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
